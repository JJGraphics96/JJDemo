<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JJ.Graphics Test Nav</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(to bottom, #a5d7f8, #003366);
      color: #fff;
    }

    .site-header {
      text-align: center;
      padding: 20px;
    }

    .flex-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .logo-link {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .logo-img {
      height: 80px;
      width: auto;
    }

    .menu-toggle {
      display: none;
      font-size: 2rem;
      cursor: pointer;
      user-select: none;
      color: #fff;
    }

    .desktop-nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .desktop-nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
    }

    .mobile-nav {
      display: none;
      flex-direction: column;
      background-color: rgba(0, 0, 0, 0.9);
      padding: 20px;
      text-align: center;
    }

    .mobile-nav a {
      color: #fff;
      text-decoration: none;
      margin: 10px 0;
      font-size: 1.2rem;
    }

    .mobile-nav.active {
      display: flex;
    }

    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }

      .desktop-nav {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="flex-header">
      <a href="index.html" class="logo-link">
        <img src="assets/images/logo.png" alt="JJ.Graphics Logo" class="logo-img" />
      </a>
      <div class="menu-toggle" id="menu-toggle">☰</div>
    </div>

    <nav class="mobile-nav" id="mobile-nav">
      <a href="#">Home</a>
      <a href="#">Work</a>
      <a href="#">Store</a>
      <a href="#">Rabbit Hole</a>
      <a href="#">Contact</a>
    </nav>

    <nav class="desktop-nav">
      <a href="#">Home</a>
      <a href="#">Work</a>
      <a href="#">Store</a>
      <a href="#">Rabbit Hole</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <script>
    const toggle = document.getElementById('menu-toggle');
    const nav = document.getElementById('mobile-nav');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('active');
    });
  </script>

</body>
</html>
