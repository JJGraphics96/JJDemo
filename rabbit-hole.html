<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Rabbit Hole | JJ.Graphics</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glider-js@1/glider.min.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="flex-header">
      <a href="index.html" class="logo-link">
        <img src="assets/images/logo.png" alt="JJ.Graphics Logo" class="logo-img" />
      </a>
    </div>


  </header>

  <main class="gallery-container">

  <!-- Series 1 -->
  <section style="text-align: center; margin-bottom: 40px;">
    <h2>Cassettes.Hotel</h2>
    <p style="max-width: 600px; margin: 0 auto; color: #aaa;">
      Cassettes.Hotel is all of the art I make for fun. Art made during emotional, spiritual exploration.
    </p>
  </section>
<section style="text-align: center;">
    <h2>The Church of ONE</h2>
    <p style="max-width: 600px; margin: 0 auto; color: #aaa;">
      Light and fire. Dualities and spiritual thresholds.
    </p>
  </section>
  <div class="glider-contain">
    <div class="glider">
      <img src="../assets/images/Product1.jpg" alt="Sample 1" />
      <img src="../assets/images/Product1.jpg" alt="Sample 2" />
      <img src="../assets/images/Product1.jpg" alt="Sample 3" />
    </div>
    <button class="glider-prev">«</button>
    <button class="glider-next">»</button>
    <div role="tablist" class="dots"></div>
  </div> <!-- 👈 closes glider-contain -->

  <!-- Divider -->
  <hr class="section-divider" />

  <!-- Series 2 -->
  <section style="text-align: center; margin-bottom: 40px; margin-top: 40px;">
    <h2>The Church of ONE</h2>
    <p style="max-width: 600px; margin: 0 auto; color: #aaa;">
      Light and fire. Dualities and spiritual thresholds.
    </p>
  </section>



</main>

  <script src="assets/js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/glider-js@1/glider.min.js"></script>
<script>
  new Glider(document.querySelector('.glider'), {
    slidesToShow: 1,
    dots: '.dots',
    arrows: {
      prev: '.glider-prev',
      next: '.glider-next'
    },
    draggable: true,
    rewind: true,
    scrollLock: true
  });
</script>
</body>
<footer style="text-align: center; padding: 40px 0; color: #999;">
    <p>© 2025 JJ.Graphics</p>
  </footer>
</html>
